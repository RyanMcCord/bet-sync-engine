name: CI

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest -v

  # Runs the service exactly as the README says, and walks through its example calls.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Start the service
        run: |
          python -m betsync --fresh --stale-after 10 > service.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
      - name: Data arrives from both books
        run: |
          for i in $(seq 1 60); do
            n=$(curl -s 'localhost:8000/bets?limit=500' | python -c "import sys,json; b=json.load(sys.stdin)['bets']; print(len({x['sportsbook'] for x in b}))")
            [ "$n" = "2" ] && break; sleep 1
          done
          curl -sf localhost:8000/status | python -m json.tool
          curl -sf 'localhost:8000/bets?sportsbook=cascade&limit=2' | python -m json.tool
          curl -sf localhost:8000/events | python -c "import sys,json; e=json.load(sys.stdin)['events']; assert e; print(len(e), 'events')"
          id=$(curl -s 'localhost:8000/bets?limit=1' | python -c "import sys,json; print(json.load(sys.stdin)['bets'][0]['id'])")
          curl -sf "localhost:8000/bets/$id" | python -c "import sys,json; b=json.load(sys.stdin); assert b['history']; print(b['id'], b['status'], len(b['history']), 'observations')"
      - name: An outage makes Cascade stale while Northstar stays fresh
        run: |
          curl -sf -X POST localhost:8000/upstream/cascade/_control -H 'content-type: application/json' -d '{"outage": true}'
          for i in $(seq 1 40); do
            s=$(curl -s localhost:8000/status | python -c "import sys,json; p=json.load(sys.stdin)['providers']; print(p['cascade']['status'], p['northstar']['status'])")
            echo "$s"; [ "$s" = "stale ok" ] && break; sleep 1
          done
          [ "$s" = "stale ok" ]
          curl -sf 'localhost:8000/bets?sportsbook=cascade&limit=1' | python -c "import sys,json; b=json.load(sys.stdin)['bets'][0]; assert b['freshness']['stale']; print('served, marked stale')"
          curl -sf -X POST localhost:8000/upstream/cascade/_control -H 'content-type: application/json' -d '{"outage": false}'
          curl -sf -X POST 'localhost:8000/sync?provider=cascade'
          for i in $(seq 1 30); do
            s=$(curl -s localhost:8000/status | python -c "import sys,json; print(json.load(sys.stdin)['providers']['cascade']['status'])")
            [ "$s" = "ok" ] && break; sleep 1
          done
          echo "cascade: $s"; [ "$s" = "ok" ]
      - name: Service log
        if: always()
        run: tail -n 60 service.log
